name: Benchmark selection

on:
  pull_request:
    paths:
      - "tools/select_benchmarks.py"
      - "allhjson/**"
      - "alljson/**"
      - "allxml/**"
      - "jsonxx/**"
      - "jvar/**"
      - ".github/workflows/benchmark-selection.yml"
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout llvm-coverage-backend
        uses: actions/checkout@v4
        with:
          repository: Ming191/llvm-coverage-backend
          path: _deps/llvm-coverage-backend

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM 23
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23 ninja-build

      - name: Install backend
        run: uv pip install --system -e _deps/llvm-coverage-backend

      - name: Select benchmark functions
        run: |
          python tools/select_benchmarks.py             --root .             --per-project 8             --output benchmark-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-manifest
          path: benchmark-manifest.json
