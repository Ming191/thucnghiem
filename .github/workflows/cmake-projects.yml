name: CMake projects

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - allhjson
          - alljson
          - allxml
          - jsonxx
          - jvar

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23

      - name: Configure
        run: |
          cmake             -S "${{ matrix.project }}"             -B "build/${{ matrix.project }}"             -G Ninja             -DCMAKE_C_COMPILER=clang-23             -DCMAKE_CXX_COMPILER=clang++-23             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build "build/${{ matrix.project }}" --parallel

      - name: Verify compile database
        run: test -s "build/${{ matrix.project }}/compile_commands.json"
